name: Build and Publish Docker Image

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Read version file and set VERSION
        run: |
          RUNNER_VERSION=$(cat releaseVersion 2>/dev/null || echo "2.333.0")
          echo "RUNNER_VERSION=${RUNNER_VERSION}" >> $GITHUB_ENV
          echo "VERSION=${RUNNER_VERSION}-yolo-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          
          FULL_IMAGE_PATH="ghcr.io/${{ github.repository_owner }}/yolo-runner/gha-runner-yolo"
          echo "FULL_IMAGE_PATH=${FULL_IMAGE_PATH,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.FULL_IMAGE_PATH }}:${{ env.VERSION }}
            ${{ env.FULL_IMAGE_PATH }}:latest
          file: ./Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create local tarball
        run: |
          mkdir -p releases
          docker save "${{ env.FULL_IMAGE_PATH }}:${{ env.VERSION }}" | gzip > "releases/gha-runner-yolo-${{ env.VERSION }}.tar.gz"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: releases/gha-runner-yolo-${{ env.VERSION }}.tar.gz
